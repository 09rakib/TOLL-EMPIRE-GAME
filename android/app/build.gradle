apply plugin: 'com.android.application'

android {
    namespace 'com.tollempire.game'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.tollempire.game'
        minSdk 24
        targetSdk 35
        versionCode 600
        versionName '0.6.0'
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
}

tasks.register('bundleGameAssets', Sync) {
    from(rootProject.file('..')) { include 'index.html', 'src/**', 'public/**' }
    into layout.buildDirectory.dir('generated/gameAssets')
    // The APK serves bundled files directly; browser service-worker caching is unnecessary.
    filesMatching('src/app.js') {
        filter { line -> line.contains("navigator.serviceWorker.register('/sw.js')") ? '' : line }
    }
}
tasks.named('preBuild').configure { dependsOn 'bundleGameAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
