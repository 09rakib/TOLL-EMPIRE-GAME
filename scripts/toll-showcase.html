<!doctype html><html lang="en"><meta charset="utf-8"><title>Toll booth upgrade review</title>
<style>body{margin:0;background:#edf0e1;color:#354d50;font:15px Arial}h1{margin:24px 28px 6px;font-size:27px}p{margin:0 28px 12px}canvas{display:block}</style>
<h1>Road-aware toll booths · five growing levels</h1><p>Automatic road alignment · larger cabins and gantries · same art in the city and upgrade preview</p>
<canvas width="1100" height="540"></canvas><script type="module">
import {tollSprite} from '/src/toll-art.js';import {project} from '/src/isometric.js';import {vehicleSprite} from '/src/vehicle-art.js';
const c=document.querySelector('canvas').getContext('2d');
for(let axis=0;axis<2;axis++)for(let level=1;level<=5;level++){
 const x=(level-1)*220,y=axis*270;c.fillStyle='#f8f7ec';c.fillRect(x+8,y+8,204,254);c.textAlign='center';c.fillStyle='#354d50';c.font='bold 15px Arial';c.fillText('LEVEL '+level,x+110,y+33);c.font='12px Arial';c.fillText(axis?'North / south road':'East / west road',x+110,y+53);
 c.save();c.translate(x+110,y+166);c.scale(1.15,1.15);
 c.save();c.transform(.75,.375,-.75,.375,0,0);if(axis)c.rotate(Math.PI/2);c.fillStyle='#b4ce94';c.fillRect(-70,-30,140,60);c.fillStyle='#d9dfc5';c.fillRect(-70,-28,140,56);c.fillStyle='#718286';c.fillRect(-70,-19,140,38);c.strokeStyle='#f2e7bc';c.setLineDash([8,6]);c.beginPath();c.moveTo(-70,0);c.lineTo(70,0);c.stroke();c.restore();
 const art=tollSprite(level,axis,2);c.drawImage(art.canvas,art.x,art.y,art.canvas.width/art.scale,art.canvas.height/art.scale);
 for(const [u,v]of [[-43,9],[46,-9]]){const p=axis?project(-v,u):project(u,v),car=vehicleSprite(axis?Math.PI/2:0,false,'#e6ba65');c.drawImage(car.canvas,p.x+car.x,p.y+car.y,car.canvas.width/car.scale,car.canvas.height/car.scale);}
 c.restore();
}
document.body.dataset.ready='true';
</script></html>
