<!doctype html><meta charset="utf-8"><title>Isometric renderer benchmark</title><style>body{margin:0;background:#d9e5c6;font:12px monospace}#scene{width:500px;height:850px;display:block}#mini{position:absolute;right:5px;top:5px;width:90px;height:60px}pre{position:absolute;top:10px;left:10px;background:#ffffe9e6;padding:12px;max-width:450px}</style><canvas id="scene"></canvas><canvas id="mini" width="120" height="80"></canvas><pre id="results">Running…</pre><script type="module">
import {Simulation} from '../src/simulation.js';import {Renderer} from '../src/isometric-renderer.js';import {citySatisfaction} from '../src/satisfaction.js';import {B} from '../src/balance.js';import {id} from '../src/world.js';
const g=new Simulation(null,()=>.4);g.coins=1e6;
for(let y=10;y<31;y+=3)for(let x=8;x<36;x+=2){if(y===19)continue;const n=id(x,y);if(g.tiles[n]!=='grass')continue;g.trees.delete(n);g.tiles[n]='building';g.buildings.push({x,y,type:(x+y)%3,kind:['home','shop','office'][(x+y)%3],level:1+(x+y)%5,managed:true});}
g.rebuild();g.cars=[];for(let i=0;i<250;i++){const origin=id(7+i%22,20);if(g.addPlannerCar(origin,id(31,20),null,i%8?'car':'bus')){const car=g.cars.at(-1);car.progress=.9;g.syncCarPosition(car);car.prevX=car.worldX;car.prevY=car.worldY;}}
const r=new Renderer(document.querySelector('#scene'),document.querySelector('#mini'),g);r.center();const params=new URLSearchParams(location.search),sync=params.has('sync'),frameCount=Number(params.get('frames'))||240,warmup=Number(params.get('warmup'))||30;const costs=[],frameIntervals=[];let i=0,last=0;
function frame(now){if(last&&i>warmup)frameIntervals.push(now-last);last=now;r.camera.x=(19.5+Math.sin(i/75)*2)*B.tile;r.camera.y=(20.5+Math.cos(i/95))*B.tile;const start=performance.now();if(i%2===0)g.update(1/30);if(i%18===0)citySatisfaction(g);r.draw(.5);if(i>warmup)costs.push(performance.now()-start);if(++i<frameCount){if(!sync)requestAnimationFrame(frame);return;}costs.sort((a,b)=>a-b);const report={...r.performanceStats,environment:'Browser simulation + rendering + satisfaction CPU timings; not a phone FPS guarantee',buildings:g.buildings.length,cars:g.cars.length,forestPlots:g.trees.size,frames:costs.length,meanFrameWorkMs:+(costs.reduce((s,v)=>s+v,0)/costs.length).toFixed(2),p95FrameWorkMs:+costs[Math.floor(costs.length*.95)].toFixed(2),maxFrameWorkMs:+costs.at(-1).toFixed(2),measuredRafFps:+(1000/(frameIntervals.reduce((s,v)=>s+v,0)/frameIntervals.length)).toFixed(1),p95FrameIntervalMs:+[...frameIntervals].sort((a,b)=>a-b)[Math.floor(frameIntervals.length*.95)].toFixed(2),framesOver25ms:frameIntervals.filter(v=>v>25).length};document.querySelector('#results').textContent=JSON.stringify(report,null,2);document.body.dataset.benchmark=JSON.stringify(report);if(!sync)fetch('/benchmark-done',{method:'POST',body:JSON.stringify(report)}).catch(()=>{});}
if(sync){for(let n=0;n<frameCount;n++)frame(performance.now());}else requestAnimationFrame(frame);
</script>
