<!doctype html><meta charset="utf-8"><title>Underpass pixel regression</title><style>body{margin:0}canvas{width:500px;height:700px}pre{position:absolute;left:10px;top:10px;background:#fffd;padding:10px}</style><canvas id="scene"></canvas><canvas id="mini" width="120" height="80" hidden></canvas><pre id="result">Testing…</pre><script type="module">
import {Simulation} from '../src/simulation.js';import {Renderer} from '../src/isometric-renderer.js';import {B} from '../src/balance.js';import {id} from '../src/world.js';
const g=new Simulation(null,()=>.4);g.trees.clear();g.coins=50000;for(let x=7;x<=31;x++)g.build(id(x,19),'road');g.buildSpan(id(12,20),id(25,20),'flyover');const r=new Renderer(document.querySelector('#scene'),document.querySelector('#mini'),g);r.center();r.camera.zoom=1.5;const baseline=new URLSearchParams(location.search).has('baseline'),painted=new Set(),drawObject=r.drawObject.bind(r);if(baseline)r.drawObject=(ctx,o)=>{if(o.kind==='car'){if(painted.has(o.car))return;painted.add(o.car);}drawObject(ctx,o);};const failures=[];let checks=0,adjacentCutaways=0,opaqueDeckPaints=0;const blit=r.blit.bind(r);r.blit=(ctx,art,...args)=>{if(r.scene.some(o=>o.kind==='flyover'&&o.art===art)){opaqueDeckPaints++;if(ctx.globalAlpha!==1)failures.push({deckAlpha:ctx.globalAlpha});}blit(ctx,art,...args);};
const c={};for(const row of [19,20])for(let x=14;x<=22;x++){Object.assign(c,{route:[id(x,row),id(x+1,row)],index:0,progress:.35,heading:0,worldX:x+.85,worldY:row+.5+9/B.tile,prevX:x+.85,prevY:row+.5+9/B.tile,angle:0,kind:'car',color:'#e93bed',waitingNode:null,done:false});g.cars=[c];painted.clear();r.camera.x=c.worldX*B.tile;r.camera.y=c.worldY*B.tile;r.draw(1);const p=r.worldToScreen(c.worldX*B.tile+7,c.worldY*B.tile+3,7),sample=r.ctx.getImageData(Math.round(p.x*r.dpr),Math.round(p.y*r.dpr),1,1).data;checks++;if(Math.abs(sample[0]-233)>18||Math.abs(sample[1]-59)>18||Math.abs(sample[2]-237)>18)failures.push({row,x,pixel:[...sample]});if(row===19&&r.underpassPainted.has(c))adjacentCutaways++;if(g.cars[0]!==c||c.done)throw Error('Vehicle identity changed during rendering');}
const result={baseline,checks,adjacentCutaways,opaqueDeckPaints,failures};document.querySelector('#result').textContent=JSON.stringify(result,null,2);document.body.dataset.pixelResult=JSON.stringify(result);if(failures.length)document.body.dataset.failed='true';
</script>
